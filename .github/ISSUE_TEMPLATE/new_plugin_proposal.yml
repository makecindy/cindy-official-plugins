name: New plugin proposal / 新插件提案
description: Optional design discussion for a new official plugin / 新官方插件的可选设计讨论
labels: [new-plugin]
body:
  - type: input
    id: name
    attributes:
      label: Plugin name & target service / 插件名与目标服务
      description: e.g. "Yahoo Mail — IMAP/SMTP mail connector" / 例：「Yahoo 邮箱 —— IMAP/SMTP 邮件连接器」
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario & scope / 场景与用途
      description: What will users ask Cindy to do with it? / 用户会让 Cindy 用它做什么？
    validations:
      required: true

  - type: textarea
    id: overlap
    attributes:
      label: Overlap check (optional) / 与现有插件的差异（可选）
      description: If a similar plugin exists, briefly explain how yours differs / 如有相近插件，简述差异
    validations:
      required: false

  - type: textarea
    id: capabilities
    attributes:
      label: Required capabilities & side effects (optional) / 所需能力与外部副作用（可选）
      description: Network hosts, credentials, Node runtime, or irreversible actions (send/post/delete) / 网络域名、凭证、Node Runtime 或外发/删除等副作用
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        This issue is **optional** — you can submit a PR directly without prior approval.
        Admission and audience follow
        [Submit your plugin](https://github.com/makecindy/cindy-official-plugins#submit-your-plugin).

        本 issue **可选**——符合标准可直接提交 PR，无需事先批准。准入与受众标准见
        [提交你的插件](https://github.com/makecindy/cindy-official-plugins/blob/main/README.zh-CN.md#提交你的插件)。
