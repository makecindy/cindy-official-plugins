name: Bug report / 缺陷报告
description: Report a problem with an official plugin / 报告某个官方插件的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post access tokens, mailbox authorization codes, app-specific
        passwords, private keys, or real user data. Security vulnerabilities go
        through [SECURITY.md](https://github.com/makecindy/cindy-official-plugins/blob/main/SECURITY.md),
        not a public issue.

        请不要贴出访问令牌、邮箱授权码、App 专用密码、私钥或真实用户数据。安全漏洞
        请走 [SECURITY.zh-CN.md](https://github.com/makecindy/cindy-official-plugins/blob/main/SECURITY.zh-CN.md)，不要开公开 issue。

  - type: input
    id: plugin
    attributes:
      label: Plugin / 插件
      description: Plugin name or directory, e.g. `cindy-github` / 插件名或目录名，例如 `cindy-github`
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened / 问题描述
      description: Describe the issue, error message, or redacted logs / 描述遇到的问题、报错信息或脱敏日志
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional) / 复现步骤（可选）
      placeholder: |
        1. …
        2. …
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Plugin & Cindy version / platform (optional) / 版本与系统（可选）
      description: e.g. macOS, Cindy 0.1.x, plugin 1.x / 例如 macOS、Cindy 版本或插件版本
    validations:
      required: false
