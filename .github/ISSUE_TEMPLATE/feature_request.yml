name: Feature request / 功能建议
description: Suggest an improvement to an existing plugin / 建议改进某个现有插件
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin / 插件
      description: Directory name of an existing plugin, e.g. "x-manager" / 现有插件的目录名，如 "x-manager"
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and why does the current behaviour fall short? / 你想完成什么？现在的行为为什么不够？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome / 期望结果
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Proposing a **new official plugin**? Use the dedicated
        [New plugin proposal](https://github.com/makecindy/cindy-official-plugins/issues/new?template=new_plugin_proposal.yml)
        form instead — it covers scope alignment, overlap check, capability
        declaration, and side-effect disclosure required for review.

        提议**新增官方插件**？请使用专用的
        [新插件提案](https://github.com/makecindy/cindy-official-plugins/issues/new?template=new_plugin_proposal.yml)
        表单——涵盖定位对齐、查重、能力声明与副作用披露，审查必需。
