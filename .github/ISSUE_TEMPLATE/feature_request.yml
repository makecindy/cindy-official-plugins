name: Feature request / 功能建议
description: Suggest an improvement to an existing plugin / 建议改进某个现有插件
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin / 插件
      description: Plugin name or directory, e.g. `x-manager` / 插件名或目录名，如 `x-manager`
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: What would you like to do / 想要什么功能
      description: Briefly describe the scenario and expected improvement / 简述使用场景和期望改进
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Additional context (optional) / 补充说明（可选）
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Proposing a **new official plugin**? You can open a PR directly, or
        optionally start a discussion with the
        [New plugin proposal](https://github.com/makecindy/cindy-official-plugins/issues/new?template=new_plugin_proposal.yml)
        template.

        提议**新增官方插件**？可以直接提交 PR，也可选用
        [新插件提案](https://github.com/makecindy/cindy-official-plugins/issues/new?template=new_plugin_proposal.yml)
        先讨论（非必需）。
