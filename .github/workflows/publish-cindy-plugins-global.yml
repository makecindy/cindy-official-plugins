name: Publish Cindy Plugins (Global)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cindy-plugin-publish-global-prod-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect plugins to publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate official plugin publish contract
        run: node --test .tests/plugin-contract.test.mjs

      - name: Validate plugin localization resources
        run: node --test .tests/localization.test.mjs

      - name: Build plugin matrix
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const path = require('node:path');

            const git = (args) => execFileSync('git', args, { encoding: 'buffer' });
            const lines = (value) => value
              .toString('utf8')
              .split('\0')
              .filter(Boolean);

            const after = process.env.AFTER_SHA ?? '';
            if (!/^[0-9a-f]{40}$/i.test(after)) {
              throw new Error('GitHub event is missing a valid target SHA');
            }

            const trackedFiles = lines(git([
              'ls-tree',
              '-r',
              '--name-only',
              '-z',
              after,
            ]));
            const pluginRoots = trackedFiles
              .filter((file) => path.posix.basename(file) === 'ghost.json')
              .map((file) => path.posix.dirname(file))
              .filter((directory) => directory !== '.')
              .sort((left, right) => right.length - left.length || left.localeCompare(right));

            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              const plugins = [...pluginRoots]
                .sort((left, right) => left.localeCompare(right))
                .map((directory) => ({ directory }));
              core.info(
                plugins.length === 0
                  ? 'No Cindy plugin directories found'
                  : `Publishing all Cindy plugins: ${plugins.map(({ directory }) => directory).join(', ')}`,
              );
              return plugins;
            }

            let before = process.env.BEFORE_SHA ?? '';
            if (!/^[0-9a-f]{40}$/i.test(before)) {
              throw new Error('GitHub push event is missing a valid before SHA');
            }
            const emptyTree = () => execFileSync(
              'git',
              ['hash-object', '-t', 'tree', '/dev/null'],
              { encoding: 'utf8' },
            ).trim();
            const hasCommit = (sha) => {
              try {
                git(['cat-file', '-e', `${sha}^{commit}`]);
                return true;
              } catch {
                return false;
              }
            };
            if (/^0{40}$/.test(before)) {
              before = emptyTree();
            } else if (!hasCommit(before)) {
              try {
                git(['fetch', '--no-tags', '--depth=1', 'origin', before]);
              } catch {
                core.warning(`Could not fetch before SHA ${before}`);
              }
              if (!hasCommit(before)) {
                core.warning('Before SHA is unavailable; publishing all current plugins');
                before = emptyTree();
              }
            }

            const changedFiles = lines(git([
              'diff',
              '--name-only',
              '--no-renames',
              '--diff-filter=AMD',
              '-z',
              before,
              after,
              '--',
            ]));
            const changedRoots = new Set();
            const sharedPackageFiles = new Set([
              'LICENSE', 'NOTICE', 'TRADEMARKS.md', 'TRADEMARKS.zh-CN.md',
            ]);
            if (changedFiles.some((file) => sharedPackageFiles.has(file))) {
              for (const root of pluginRoots) changedRoots.add(root);
            }
            for (const file of changedFiles) {
              const root = pluginRoots.find(
                (directory) => file === directory || file.startsWith(`${directory}/`),
              );
              if (root) changedRoots.add(root);
            }

            const plugins = [...changedRoots]
              .sort((left, right) => left.localeCompare(right))
              .map((directory) => ({ directory }));
            core.info(
              plugins.length === 0
                ? 'No changed Cindy plugin directories found'
                : `Changed Cindy plugins: ${plugins.map(({ directory }) => directory).join(', ')}`,
            );
            return plugins;

  package:
    name: Package ${{ matrix.plugin.directory }} for Global
    needs: detect
    if: ${{ needs.detect.outputs.plugins != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package plugin
        env:
          PLUGIN_DIRECTORY: ${{ matrix.plugin.directory }}
        run: |
          .github/scripts/package-plugin.sh \
            "${PLUGIN_DIRECTORY}" \
            "$RUNNER_TEMP/plugin.cindy"

      - name: Record package identity
        id: artifact
        env:
          PLUGIN_DIRECTORY: ${{ matrix.plugin.directory }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum plugin.cindy > plugin.cindy.sha256
          printf '%s' "$GITHUB_SHA" > commit.txt
          printf '%s' "$PLUGIN_DIRECTORY" > plugin.txt
          printf 'name=package-%s\n' "$(printf '%s' "$PLUGIN_DIRECTORY" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Store complete package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ runner.temp }}/plugin.cindy
            ${{ runner.temp }}/plugin.cindy.sha256
            ${{ runner.temp }}/commit.txt
            ${{ runner.temp }}/plugin.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish ${{ matrix.plugin.directory }} to Global prod
    needs: [detect, package]
    # Keep successful plugins publishable when another matrix build fails.
    # A failed package has no artifact, so its own upload cannot proceed.
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.plugins != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    steps:
      # No checkout, dependency download, plugin code or build scripts in this job.
      - name: Select this run's package
        id: artifact
        env:
          PLUGIN_DIRECTORY: ${{ matrix.plugin.directory }}
        run: |
          printf 'name=package-%s\n' "$(printf '%s' "$PLUGIN_DIRECTORY" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Download complete package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}

      - name: Verify package identity
        env:
          PLUGIN_DIRECTORY: ${{ matrix.plugin.directory }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          test "$(cat plugin.txt)" = "$PLUGIN_DIRECTORY"
          # Do not interpret artifact contents as shell or checksum file paths.
          expected="$(cat plugin.cindy.sha256)"
          actual="$(sha256sum plugin.cindy)"
          test "$expected" = "$actual"

      - name: Publish plugin
        env:
          CINDY_PLUGIN_PLATFORM_URL_GLOBAL: ${{ secrets.CINDY_PLUGIN_PLATFORM_URL_GLOBAL }}
        run: |
          set -euo pipefail
          : "${CINDY_PLUGIN_PLATFORM_URL_GLOBAL:?CINDY_PLUGIN_PLATFORM_URL_GLOBAL is not configured}"

          oidc_response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cindy-plugin")"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"
          echo "::add-mask::${oidc_token}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-connrefused \
            --retry-delay 2 \
            --retry-max-time 180 \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/plugin.cindy" \
            "${CINDY_PLUGIN_PLATFORM_URL_GLOBAL%/}"
          echo
