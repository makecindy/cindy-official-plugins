name: Verify pull request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Repository-wide gates
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate official plugin publish contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --test .tests/plugin-contract.test.mjs

      - name: Validate plugin localization resources
        run: node --test .tests/localization.test.mjs

      - name: Validate provisioning registrations
        run: node --test .tests/provisioning.test.mjs

      - name: Validate publish workflows
        run: node --test .tests/publish-workflows.test.mjs

  changed-plugins:
    name: Test and dry-run packaging for changed plugins
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed plugin directories
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git ls-tree -r --name-only "${HEAD_SHA}" \
            | sed -n 's|/ghost\.json$||p' | sort -u > "${RUNNER_TEMP}/plugin-roots"
          git diff --name-only --no-renames --diff-filter=AMD "${BASE_SHA}" "${HEAD_SHA}" \
            > "${RUNNER_TEMP}/changed-files"
          if grep -Eq '^(LICENSE|NOTICE|TRADEMARKS\.md|TRADEMARKS\.zh-CN\.md)$' \
            "${RUNNER_TEMP}/changed-files"; then
            changed="$(cat "${RUNNER_TEMP}/plugin-roots")"
          else
            changed="$(
              awk '
                NR == FNR { roots[$0] = 1; next }
                {
                  for (root in roots) {
                    if ($0 == root || index($0, root "/") == 1) {
                      print root
                      break
                    }
                  }
                }
              ' "${RUNNER_TEMP}/plugin-roots" "${RUNNER_TEMP}/changed-files" | sort -u
            )"
          fi
          if [[ -z "${changed}" ]]; then
            echo "plugins=[]" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${changed}" | jq -R -s -c 'split("\n")[:-1] | map({directory: .})' \
              | sed 's/^/plugins=/' >> "${GITHUB_OUTPUT}"
          fi

      - name: Run plugin tests (installing per-plugin dependencies first)
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        env:
          PLUGINS: ${{ steps.changes.outputs.plugins }}
        run: |
          set -euo pipefail
          failed=0
          for directory in $(jq -r '.[].directory' <<<"${PLUGINS}"); do
            if [[ -f "${directory}/package.json" ]]; then
              echo "::group::npm ci (${directory})"
              npm ci --prefix "${directory}"
              echo "::endgroup::"
            fi
            test_file=".tests/${directory}.test.mjs"
            if [[ -f "${test_file}" ]]; then
              echo "::group::node --test ${test_file}"
              node --test "${test_file}" || failed=1
              echo "::endgroup::"
            else
              # Make the skip visible instead of leaving a green step that ran
              # zero plugin tests.
              echo "::notice::no runnable .tests/${directory}.test.mjs — plugin-specific tests skipped for ${directory}"
            fi
          done
          exit "${failed}"

      - name: Dry-run plugin packaging
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        env:
          PLUGINS: ${{ steps.changes.outputs.plugins }}
        run: |
          set -euo pipefail
          for directory in $(jq -r '.[].directory' <<<"${PLUGINS}"); do
            echo "::group::Package ${directory}"
            package="${RUNNER_TEMP}/${directory//\//_}.cindy"
            .github/scripts/package-plugin.sh "${directory}" "${package}"
            unzip -l "${package}"
            # git archive places the plugin directory's contents at the zip
            # root (HEAD:<dir>), alongside the --add-file'd root documents.
            for required in LICENSE NOTICE TRADEMARKS.md TRADEMARKS.zh-CN.md ghost.json; do
              # `unzip -Z1` prints bare entry names and exits 0 regardless of
              # the consumer, so an early-closing grep under pipefail cannot
              # turn a complete package into a false "missing file" failure.
              entries="$(unzip -Z1 "${package}")"
              grep -q "^${required}\$" <<<"${entries}" || {
                echo "::error::${package} is missing ${required}"
                exit 1
              }
            done
            echo "::endgroup::"
          done

      - name: Require production Cindy verification attestation
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        run: |
          set -euo pipefail
          pr_body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"
          if ! grep -Eq '^- \[[xX]\] \*\*Production Cindy verification / 生产版 Cindy 验证\*\*' \
            <<<"${pr_body}"; then
            echo "::error::Check the Production Cindy verification / 生产版 Cindy 验证 box in the PR body after installing and exercising every changed plugin on a real device with a stable production Cindy build. If a plugin declares minCindyVersion, the verified Cindy version must be greater than or equal to it."
            exit 1
          fi
