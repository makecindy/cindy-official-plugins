<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- GitLab 意识自定义设置区(意识自绘,cindy-ghost:// 沙箱页)。
     主流程 = 多连接管理:每条连接是「实例地址 + Personal Access Token」,经
     /connections 通道交给主机——POST 后主机弹确认框(域名放行 + token 入库),
     本页拿不回任何 token 明文,只能查回列表(host + 尾 4 位指纹)。
     「测试」由电子脑代跑:本页 fetch('/wake') 叫醒电子脑,经 BroadcastChannel
     递活(带 connectionId),电子脑 cindy.fetch GET /api/v4/user(PRIVATE-TOKEN
     由主机按 URL 命中的连接注入)后把用户名广播回来——本页零网络直连,
     token 字节不经过任何可读回的地方。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* title 右缩 2px 对齐胶囊输入框的文字视觉边(同 cindy-github / xd-mivo)。 */
  .label-row { display: flex; align-items: center; gap: 8px; padding-left: 2px; }
  .label-row .name { font-weight: 500; }
  .badge {
    padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: var(--surface-chip, #efefec); color: var(--text-tertiary, #8a8a86);
  }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  /* 胶囊输入框 + 眼睛切换,样式与 cindy-github 设置页逐字对齐。 */
  .pill {
    display: flex; flex: 1 1 auto; align-items: center; height: 32px;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 999px;
    background: var(--surface-elevated, #ffffff); padding: 0 4px 0 12px;
  }
  .pill:focus-within { border-color: var(--focus-ring, #4c8dff); }
  .pill input {
    flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--text-primary, #1a1a1a); font: inherit;
  }
  .pill input::placeholder { color: var(--text-placeholder, #a8a8a4); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-tertiary, #8a8a86); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-chip, #efefec); }
  /* 空框时藏眼睛(已存值读不回,点了必没反应);占位不塌,免输入首字符时行内跳动。 */
  .icon-btn.hidden { visibility: hidden; pointer-events: none; }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn .off { display: none; }
  .icon-btn.revealed .on { display: none; }
  .icon-btn.revealed .off { display: block; }
  .btn {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  /* 连接行:host + @username + 尾号 + 默认标记 / 设默认 + 测试 + 删除。 */
  .account {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding: 6px 12px; border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 10px; background: var(--surface-elevated, #ffffff);
  }
  .account .who { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .who .user { color: var(--text-secondary, #55554f); }
  .account .tag { font-size: 11px; color: var(--text-tertiary, #8a8a86); flex: 0 0 auto; }
  .account .default-badge {
    padding: 1px 8px; border-radius: 999px; font-size: 11px; flex: 0 0 auto;
    background: var(--surface-chip, #efefec); color: var(--text-secondary, #55554f);
  }
  .account .mini {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0); background: transparent;
    color: var(--text-secondary, #55554f); font-family: inherit;
  }
  .account .mini:hover { background: var(--surface-chip, #efefec); }
  .account .mini:disabled { opacity: 0.5; cursor: default; }
  .empty {
    margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 12px;
    border: 1px dashed var(--border-default, #e4e4e0);
    color: var(--text-tertiary, #8a8a86);
  }
  #status { margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86); min-height: 16px; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <div class="label-row">
    <span class="name" data-i18n="instancesTitle">GitLab instances</span>
    <span class="badge" data-i18n="instancesBadge">Self-hosted / multiple instances</span>
  </div>
  <div id="list"></div>
  <div class="input-row">
    <div class="pill">
      <input id="host" type="text" placeholder="Instance URL, e.g. git.example.com" aria-label="GitLab instance URL" data-i18n-placeholder="hostPlaceholder" data-i18n-aria-label="hostAria" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="input-row">
    <div class="pill">
      <input id="token" type="password" placeholder="glpat-… Personal Access Token with api scope" aria-label="GitLab Personal Access Token" data-i18n-placeholder="tokenPlaceholder" data-i18n-aria-label="tokenAria" autocomplete="off" spellcheck="false">
      <button id="eye" class="icon-btn" type="button" title="Show or hide token" aria-label="Show or hide token" data-i18n-title="toggleToken" data-i18n-aria-label="toggleToken">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      </button>
    </div>
    <button id="add" class="btn" type="button" data-i18n="add">Add</button>
  </div>
  <p id="status"></p>
  <script src="/settings.js"></script>
</body>
</html>
