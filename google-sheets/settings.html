<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/settings.css">
</head>
<body>
  <div class="title">
    <span data-i18n="accountTitle">Google Sheets account</span>
    <span class="badge" data-i18n="separateAuthorization">Separate authorization</span>
  </div>
  <p class="hint" data-i18n="permissionHint">Only requests Sheets access and does not grant Gmail, Calendar, or Drive access.</p>
  <div id="accounts"></div>
  <button id="connect" class="primary" type="button" data-i18n="connectAccount">Connect account</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="/settings.js"></script>
</body>
</html>
