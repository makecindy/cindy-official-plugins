<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Board</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;padding:12px;font:13px/1.5 var(--font-sans,system-ui);color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas);min-height:100vh;display:flex;flex-direction:column}
svg{flex:none}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:flex;padding:3px;gap:2px;border-radius:10px;background:var(--color-background-secondary,rgba(128,128,128,.1));border:1px solid var(--color-border-primary,rgba(128,128,128,.18))}
.seg button{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:8px;padding:5px 12px;font:600 12px/1.4 inherit;color:inherit;opacity:.62;cursor:pointer}
.seg button.on{background:var(--color-background-primary,Canvas);opacity:1;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--color-border-primary,rgba(128,128,128,.25));background:var(--color-background-secondary,rgba(128,128,128,.06));color:inherit;border-radius:8px;padding:5px 12px;font:12px inherit;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.primary{background:var(--color-accent,#4f6ef7);border-color:transparent;color:#fff}
.btn.icon{padding:5px 8px}
#refresh{margin-left:0}

.summary{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--color-background-secondary,rgba(128,128,128,.08));border:1px solid var(--color-border-primary,rgba(128,128,128,.18));opacity:.85}

.board{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;align-items:stretch;flex:1;min-height:240px}
.col{flex:1 0 180px;min-width:180px;border-radius:12px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 130px);overflow-y:auto;
  background:var(--color-background-secondary,rgba(128,128,128,.07));border:1px solid var(--color-border-primary,rgba(128,128,128,.16))}
.col-head{display:flex;align-items:center;gap:6px;margin-bottom:9px;padding:0 2px}
.col-icon{width:15px;height:15px;opacity:.9}
.col[data-kind="running"] .col-icon{color:#3b82f6}
.col[data-kind="blocked"] .col-icon{color:#ef4444}
.col[data-kind="queued"] .col-icon{color:#f59e0b}
.col[data-kind="idle"] .col-icon{color:#22c55e}
.col-title{font-size:12px;font-weight:600}
.count{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;
  background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-primary,rgba(128,128,128,.2));opacity:.7}
.count:empty{display:none}

.card{background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-primary,rgba(128,128,128,.18));
  border-radius:10px;padding:9px 10px;margin-bottom:8px;overflow-wrap:anywhere;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s,border-color .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px);border-color:var(--color-accent,#4f6ef7)}
.card:last-child{margin-bottom:0}
.card .topline{display:flex;align-items:center;gap:6px}
.avatar{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.card .t{font-weight:600;font-size:12.5px;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:11px;opacity:.6;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;margin:5px 4px 0 0;
  background:var(--color-background-secondary,rgba(128,128,128,.12));border:1px solid var(--color-border-primary,rgba(128,128,128,.2));opacity:.85}
.badge.warn{color:#b45309;border-color:#f59e0b66;background:#f59e0b1a;opacity:1}
.cwd{font-family:ui-monospace,monospace;font-size:10px;opacity:.5;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-hint{font-size:10px;opacity:0;margin-left:auto;transition:opacity .15s}
.card:hover .open-hint{opacity:.55}

#agents{flex:1;overflow-y:auto}
#policy{flex:1;overflow-y:auto}
.empty{font-size:11px;opacity:.4;text-align:center;padding:14px 0;border:1px dashed var(--color-border-primary,rgba(128,128,128,.25));border-radius:8px}
#status{font-size:11px;opacity:.55;margin:8px 4px 0;white-space:pre-wrap}

.agent-group{margin-bottom:14px}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 8px;border-radius:10px;
  background:var(--color-background-secondary,rgba(128,128,128,.08));border:1px solid var(--color-border-primary,rgba(128,128,128,.16))}
.agent-head .name{font-weight:600;font-size:12.5px;flex:1}
.agent-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding-left:4px}
.subtask{border:1px solid var(--color-border-primary,rgba(128,128,128,.16));border-radius:8px;padding:7px 9px;
  background:var(--color-background-primary,Canvas);cursor:pointer;font-size:12px}
.subtask:hover{border-color:var(--color-accent,#4f6ef7)}
.subtask .st{font-size:10px;opacity:.6;margin-top:2px}
.section-title{font-size:12px;font-weight:700;opacity:.7;margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}

.panel{border:1px solid var(--color-border-primary,rgba(128,128,128,.18));border-radius:12px;padding:12px;margin-bottom:12px;
  background:var(--color-background-secondary,rgba(128,128,128,.05))}
.panel h3{margin:0 0 8px;font-size:13px}
.panel p.hint{font-size:11px;opacity:.6;margin:0 0 8px}
textarea,input[type=text],select{width:100%;font:12px/1.5 inherit;color:inherit;background:var(--color-background-primary,Canvas);
  border:1px solid var(--color-border-primary,rgba(128,128,128,.25));border-radius:8px;padding:7px 9px;resize:vertical}
textarea{min-height:64px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.result{white-space:pre-wrap;font-size:12px;margin-top:10px;padding:10px;border-radius:8px;
  background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-primary,rgba(128,128,128,.18));max-height:320px;overflow:auto}
.hidden{display:none}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--color-background-primary,Canvas);
  border:1px solid var(--color-border-primary,rgba(128,128,128,.3));border-radius:10px;padding:8px 14px;font-size:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#toast.show{opacity:1}
#toast.err{border-color:#ef4444aa}

.patrol{position:relative;width:100%;height:0;overflow:visible;pointer-events:none}
.patrol-icon{position:absolute;top:-4px;left:0;opacity:0;color:#3b82f6;
  filter:drop-shadow(0 2px 6px rgba(59,130,246,.45));will-change:transform,opacity}
body.patrolling .patrol-icon{animation:patrol-walk 3.6s cubic-bezier(.45,.05,.35,1) infinite}
body.patrolling .col{animation:col-scan 3.6s ease-in-out infinite}
body.patrolling .col:nth-child(1){animation-delay:.12s}
body.patrolling .col:nth-child(2){animation-delay:.5s}
body.patrolling .col:nth-child(3){animation-delay:.88s}
body.patrolling .col:nth-child(4){animation-delay:1.26s}
@keyframes patrol-walk{
  0%{left:2%;opacity:0;transform:translateY(0) scale(.9)}
  6%{opacity:1;transform:translateY(-1px) scale(1)}
  25%{transform:translateY(1px) scale(1)}
  50%{left:50%;opacity:1;transform:translateY(-1px) scale(1)}
  75%{transform:translateY(1px) scale(1)}
  94%{left:94%;opacity:1;transform:translateY(-1px) scale(1)}
  100%{left:96%;opacity:0;transform:translateY(0) scale(.9)}}
@keyframes col-scan{
  0%,100%{box-shadow:inset 0 0 0 rgba(59,130,246,0);background-color:var(--color-background-secondary,rgba(128,128,128,.07))}
  18%{box-shadow:inset 0 2px 0 #3b82f6dd,0 0 0 1px #3b82f633;background-color:#3b82f60d}
  36%{box-shadow:inset 0 0 0 rgba(59,130,246,0);background-color:var(--color-background-secondary,rgba(128,128,128,.07))}}
@media (prefers-reduced-motion:reduce){body.patrolling .patrol-icon,body.patrolling .col{animation:none}}

.term-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
.term-box{width:min(1200px,96vw);height:88vh;max-height:88vh;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  border:1px solid rgba(128,128,128,.35);background:var(--color-background-primary,Canvas);box-shadow:0 18px 60px rgba(0,0,0,.4)}
.term-head{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--color-border-primary,rgba(128,128,128,.2));font-size:12px}
.term-head .t{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-wrap{position:relative;flex:1;display:flex;min-height:0;flex-direction:column}
.term-body{flex:1;overflow:auto;background:#0c1017;color:#d6e0ee;padding:12px 14px;margin:0;outline:none;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;cursor:text}
.term-prompt{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#0c1017;
  border-top:1px solid #1e293b;transition:box-shadow .15s,border-color .15s}
.term-prompt .ps1{color:#64748b;font:600 12px ui-monospace,monospace;transition:color .15s}
.term-prompt:focus-within{border-top-color:#3b82f6;box-shadow:inset 0 1px 0 #3b82f699}
.term-prompt:focus-within .ps1{color:#7aa2ff}
.term-prompt input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#f8fafc;
  font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:2px 0}
.term-prompt input::placeholder{color:#475569}
.term-prompt.hidden-input{display:none}
.tiny{border:1px solid #334155;background:#111a26;color:#cbd5e1;border-radius:6px;padding:3px 9px;
  font:600 11px ui-monospace,monospace;cursor:pointer;flex:none}
.tiny:hover{border-color:#3b82f6;color:#fff}
.tiny.primary{background:#2563eb;border-color:transparent;color:#fff}
.term-prompt input::placeholder{color:#64748b}
.term-foot{display:flex;gap:10px;align-items:center;padding:5px 12px;border-top:1px solid var(--color-border-primary,rgba(128,128,128,.2));font-size:11px;opacity:.7}
.term-echo{font-family:ui-monospace,monospace;color:#7aa2ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;
  border:1px solid var(--color-border-primary,rgba(128,128,128,.25));background:var(--color-background-secondary,rgba(128,128,128,.06));
  color:inherit;border-radius:8px;cursor:pointer}
.iconbtn:hover{border-color:var(--color-accent,#4f6ef7)}
.iconbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  white-space:nowrap;font:11px/1.4 var(--font-sans,system-ui);padding:4px 8px;border-radius:6px;z-index:40;
  background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-primary,rgba(128,128,128,.3));box-shadow:0 4px 14px rgba(0,0,0,.2)}

.chat{border-top:1px solid var(--color-border-primary,rgba(128,128,128,.2));padding-top:8px;margin-top:6px}
.chat-log{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{max-width:85%;padding:6px 10px;border-radius:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--color-accent,#4f6ef7);color:#fff;border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;background:var(--color-background-secondary,rgba(128,128,128,.12));border:1px solid var(--color-border-primary,rgba(128,128,128,.18));border-bottom-left-radius:3px}
.chat-row{display:flex;gap:6px}
.chat-row input{flex:1}

.wd-chips{display:flex;gap:4px;flex-wrap:wrap}
.wd-chips button{border:1px solid var(--color-border-primary,rgba(128,128,128,.25));background:var(--color-background-secondary,rgba(128,128,128,.06));color:inherit;border-radius:99px;padding:3px 10px;font:11px inherit;cursor:pointer;opacity:.7}
.wd-chips button.on{opacity:1;background:var(--color-accent,#4f6ef7);color:#fff;border-color:transparent}

.sched-status{font-size:12px;opacity:.8;margin-bottom:8px}
.report{border-top:1px solid var(--color-border-primary,rgba(128,128,128,.15));padding:8px 2px}
.report:first-child{border-top:0;padding-top:0}
.report .v{font-weight:600;font-size:12px}
.report .b{font-size:11px;opacity:.7;margin-top:3px;white-space:pre-wrap}
.report .t{font-size:10px;opacity:.45;margin-top:3px}
</style>
<div class="top">
  <div class="seg" role="tablist">
    <button id="v-cindy" class="on" role="tab"><span></span></button>
    <button id="v-herdr" role="tab"><span></span></button>
    <button id="v-agent" role="tab"><span></span></button>
    <button id="v-policy" role="tab"><span></span></button>
  </div>
  <label style="font-size:12px;display:flex;align-items:center;gap:5px;opacity:.8"><input type="checkbox" id="idle-busy" style="width:auto"><span id="idle-busy-label"></span></label>
  <span id="countdown" style="font-size:11px;opacity:.5;margin-left:auto"></span>
  <button class="btn" id="refresh" disabled style="margin-left:0"><span></span></button>
</div>
<div class="summary" id="summary"></div>
<div class="patrol" aria-hidden="true"><svg class="patrol-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V5l7-3z"/><circle cx="9.5" cy="11" r="1.2"/><circle cx="14.5" cy="11" r="1.2"/><path d="M9 15.5c1.5 1 4.5 1 6 0"/></svg></div>
<div class="board" id="board"></div>
<div id="agents" class="hidden"></div>
<div id="policy" class="hidden">
  <div class="panel">
    <h3 id="t-policy-title"></h3>
    <p class="hint" id="t-policy-hint"></p>
    <textarea id="policy-text"></textarea>
    <div class="row"><button class="btn primary" id="policy-save"><span id="t-policy-save"></span></button></div>
  </div>
  <div class="panel">
    <h3 id="t-plan-title"></h3>
    <p class="hint" id="t-plan-hint"></p>
    <div class="sched-status" id="sched-status"></div>
    <div class="row">
      <select id="sched-mode">
        <option value="interval" id="t-mode-interval"></option>
        <option value="daily" id="t-mode-daily"></option>
        <option value="weekly" id="t-mode-weekly"></option>
      </select>
      <span id="sched-interval-row" style="display:flex;align-items:center;gap:5px">
        <input type="number" id="sched-every" value="30" min="1" max="999" style="width:64px">
        <select id="sched-unit"><option value="minutes" id="t-unit-min"></option><option value="hours" id="t-unit-hour"></option></select>
      </span>
      <input type="time" id="sched-time" value="09:00" class="hidden">
      <label style="font-size:12px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="sched-enabled" checked style="width:auto"><span id="t-enabled"></span></label>
      <button class="btn primary" id="sched-apply"><span id="t-apply"></span></button>
    </div>
    <div class="row hidden" id="sched-weekly-row">
      <div class="wd-chips" id="sched-weekdays"></div>
    </div>
  </div>
  <div class="panel">
    <h3 id="t-patrol-title"></h3>
    <p class="hint" id="t-patrol-hint"></p>
    <textarea id="patrol-text"></textarea>
    <div class="row"><button class="btn primary" id="patrol-save"><span id="t-patrol-save"></span></button>
      <button class="btn" id="patrol-now"><span id="t-patrol-now"></span></button>
      <span id="patrol-model" style="font-size:11px;opacity:.6"></span></div>
    <div class="result hidden" id="patrol-result"></div>
  </div>
  <div class="panel">
    <h3 id="t-analyze-title"></h3>
    <p class="hint" id="t-analyze-hint"></p>
    <div class="row">
      <button class="btn" id="pick-model"><span id="t-pick-model"></span></button>
      <span id="model-label" style="font-size:11px;opacity:.6"></span>
      <button class="btn primary" id="analyze"><span id="t-analyze"></span></button>
    </div>
    <input type="text" id="analyze-focus" style="margin-top:8px">
    <div class="result hidden" id="analyze-result"></div>
  </div>
  <div class="panel">
    <h3 id="t-reports-title"></h3>
    <p class="hint" id="t-reports-hint"></p>
    <div id="reports"></div>
  </div>
  <div class="panel">
    <h3 id="t-auto-title"></h3>
    <p class="hint" id="t-auto-hint"></p>
    <textarea id="auto-purpose"></textarea>
    <div class="row">
      <select id="auto-interval">
        <option value="1800000" id="t-every30"></option>
        <option value="3600000" selected id="t-every60"></option>
        <option value="7200000" id="t-every120"></option>
        <option value="14400000" id="t-every240"></option>
      </select>
      <select id="auto-companion"></select>
      <button class="btn primary" id="automate"><span id="t-automate"></span></button>
    </div>
    <div class="result hidden" id="automate-result"></div>
  </div>
</div>
<p id="status" role="status"></p>
<div class="chat">
  <div class="chat-log"></div>
  <div class="chat-row">
    <input type="text" id="chat-input">
    <button class="btn primary" id="chat-send"><span id="t-send"></span></button>
  </div>
</div>
<div id="toast" role="alert"></div>

const ANSI_BASE = ['#1c1c1c','#f14c4c','#23d18b','#f5f543','#3b8eea','#d670d6','#29b8db','#e5e5e5'];
const ANSI_BRIGHT = ['#666666','#ff6b6b','#5ce6a2','#fdfd6b','#6db1ff','#e58be5','#6ad8f0','#ffffff'];
function ansi256(i) {
  if (i < 8) return ANSI_BASE[i];
  if (i < 16) return ANSI_BRIGHT[i - 8];
  if (i >= 232) {
    const grey = 8 + (i - 232) * 10;
    return `rgb(${grey},${grey},${grey})`;
  }
  const n = i - 16;
  const levels = [0, 95, 135, 175, 215, 255];
  return `rgb(${levels[Math.floor(n / 36)]},${levels[Math.floor(n / 6) % 6]},${levels[n % 6]})`;
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function ansiToHtml(raw) {
  const text = String(raw ?? '');
  let out = '';
  let fg = null;
  let bg = null;
  let bold = false;
  let dim = false;
  let italic = false;
  let underline = false;
  const open = () => {
    let style = '';
    if (fg) style += `color:${fg};`;
    if (bg) style += `background:${bg};`;
    if (bold) style += 'font-weight:700;';
    if (dim) style += 'opacity:.65;';
    if (italic) style += 'font-style:italic;';
    if (underline) style += 'text-decoration:underline;';
    return style ? `<span style="${style}">` : '';
  };
  let spanOpen = false;
  const close = () => {
    if (!spanOpen) return '';
    spanOpen = false;
    return '</span>';
  };
  const re = /\x1b\[([0-9;]*)([A-Za-z])/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[2] !== 'm') continue;
    const codes = m[1] === '' ? [0] : m[1].split(';').map(x => Number(x));
    let changed = false;
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) { fg = bg = null; bold = dim = italic = underline = false; }
      else if (c === 1) bold = true;
      else if (c === 2) dim = true;
      else if (c === 3) italic = true;
      else if (c === 4) underline = true;
      else if (c === 22) { bold = false; dim = false; }
      else if (c === 23) italic = false;
      else if (c === 24) underline = false;
      else if (c === 39) fg = null;
      else if (c === 49) bg = null;
      else if (c >= 30 && c <= 37) fg = ANSI_BASE[c - 30];
      else if (c >= 40 && c <= 47) bg = ANSI_BASE[c - 40];
      else if (c >= 90 && c <= 97) fg = ANSI_BRIGHT[c - 90];
      else if (c >= 100 && c <= 107) bg = ANSI_BRIGHT[c - 100];
      else if (c === 38 && codes[i + 1] === 5) { fg = ansi256(codes[i + 2] ?? 0); i += 2; }
      else if (c === 48 && codes[i + 1] === 5) { bg = ansi256(codes[i + 2] ?? 0); i += 2; }
      else if (c === 38 && codes[i + 1] === 2) { fg = `rgb(${codes[i + 2] ?? 0},${codes[i + 3] ?? 0},${codes[i + 4] ?? 0})`; i += 4; }
      else if (c === 48 && codes[i + 1] === 2) { bg = `rgb(${codes[i + 2] ?? 0},${codes[i + 3] ?? 0},${codes[i + 4] ?? 0})`; i += 4; }
      else continue;
      changed = true;
    }
    if (!changed) continue;
    out += close();
    const tag = open();
    if (tag) { out += tag; spanOpen = true; }
  }
  out += esc(text.slice(last));
  out += close();
  return out;
}

let LOCALE = 'en';
function normalizeLocale(raw) {
  const value = String(raw ?? '').trim();
  if (!value) return 'en';
  if (I18N[value]) return value;
  const lower = value.toLowerCase();
  if (lower.startsWith('zh-hant') || lower === 'zh-tw' || lower === 'zh-hk') return 'zh-TW';
  if (lower.startsWith('zh')) return 'zh-CN';
  const base = lower.split('-')[0];
  for (const key of Object.keys(I18N)) if (key.toLowerCase() === base) return key;
  if (base === 'pt') return lower.includes('br') ? 'pt-BR' : 'pt-PT';
  return 'en';
}
function t(key, vars) {
  const dict = I18N[LOCALE] ?? I18N.en;
  let text = dict[key] ?? I18N.en[key] ?? key;
  for (const [k, v] of Object.entries(vars ?? {})) text = text.replaceAll(`{${k}}`, String(v));
  return text;
}

async function call(name, args) {
  const r = await app.callServerTool({ name, arguments: args });
  const text = r.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') ?? '';
  return JSON.parse(text);
}

let toastTimer = null;
function toast(text, isErr) {
  const el = document.querySelector('#toast');
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function openTarget(kind, id) {
  if (kind === 'pane') { openPaneModal(id, id); return; }
  _openTarget(kind, id);
}

let termTimer = null;

async function openPaneModal(paneId, title) {
  closePaneModal();
  const modal = document.createElement('div');
  modal.className = 'term-modal';
  modal.innerHTML = `<div class="term-box">
    <div class="term-head"><span class="t"></span>
      <button class="iconbtn" data-act="refresh">${ICONS.sync}</button>
      <button class="iconbtn" data-act="toggle-input">${ICONS.terminal}</button>
      <button class="iconbtn" data-act="focus">${ICONS.focus}</button>
      <button class="iconbtn" data-act="close">${ICONS.close}</button></div>
    <div class="term-wrap">
      <pre class="term-body">${t('loading')}</pre>
      <div class="term-prompt"><span class="ps1">❯</span><input class="term-line" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="tiny primary" data-act="send-line"></button>
        <button class="tiny" data-act="send-enter">⏎</button>
      </div>
    </div>
    <div class="term-foot"><span class="term-hint"></span><span class="term-echo"></span></div>
  </div>`;
  modal.querySelector('.t').textContent = title || paneId;
  modal.querySelector('.term-hint').textContent = t('termHint');
  const tips = { refresh: t('refreshPane'), focus: t('focusHerdr'), close: t('close'), 'toggle-input': '' };
  for (const btn of modal.querySelectorAll('.iconbtn')) btn.dataset.tip = tips[btn.dataset.act] ?? '';
  const body = modal.querySelector('.term-body');
  const line = modal.querySelector('.term-line');
  const echo = modal.querySelector('.term-echo');
  line.placeholder = t('termPrompt');
  let lastText = null;

  function paint() {
    body.innerHTML = lastText ? ansiToHtml(lastText) : '';
    body.scrollTop = body.scrollHeight;
  }
  async function load() {
    try {
      const r = await call('board_pane_read', { paneId, lines: 80 });
      lastText = r.ok ? (r.text || '—') : t('readFailed', { e: r.message ?? '' });
    } catch (e) { lastText = t('readFailed', { e: e?.message ?? e }); }
    paint();
  }

  let refreshTimer = null;
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(load, 260);
  }
  async function sendKeys(keys) {
    try {
      const r = await call('board_pane_action', { paneId, action: 'keys', keys });
      if (!r.ok) toast(t('sendFailed', { e: r.message ?? r.errorCode ?? '' }), true);
    } catch (e) { toast(t('sendFailed', { e: e?.message ?? e }), true); }
    scheduleRefresh();
  }
  let sending = false;
  async function sendLine() {
    if (sending) return;
    const text = line.value;
    if (!text) return;
    sending = true;
    void debugLog('send-click', {});
    try {
      // 原子提交整行（text + Enter 一次写入），避免两次 RPC 之间被其它输入插队拼接。
      const sent = await call('board_pane_action', { paneId, action: 'send_input', text });
      if (!sent.ok) {
        toast(t('sendFailedKeepDraft', { e: sent.message ?? sent.errorCode ?? '' }), true);
        return;
      }
      if (line.value === text) line.value = '';
      echo.textContent = `› ${text}`;
      setTimeout(() => { echo.textContent = ''; }, 1200);
    } catch (e) {
      toast(t('sendFailedKeepDraft', { e: e?.message ?? e }), true);
    } finally {
      sending = false;
      scheduleRefresh();
    }
  }

  const promptRow = modal.querySelector('.term-prompt');
  const toggleBtn = modal.querySelector('[data-act="toggle-input"]');
  function setInputVisible(visible) {
    promptRow.classList.toggle('hidden-input', !visible);
    toggleBtn.dataset.tip = visible ? t('hideInput') : t('showInput');
    toggleBtn.style.opacity = visible ? '1' : '.5';
    if (visible) line.focus();
    void call('board_policy', { op: 'set', termInputVisible: visible }).catch(() => {});
  }
  toggleBtn.onclick = () => {
    const visible = !promptRow.classList.contains('hidden-input');
    setInputVisible(!visible);
    if (!visible) toast(t('inputHidden'));
  };
  void call('board_policy', { op: 'get' }).then(r => {
    if (r && r.termInputVisible === false) setInputVisible(false);
  }).catch(() => {});

  const sendBtn = modal.querySelector('[data-act="send-line"]');
  const enterBtn = modal.querySelector('[data-act="send-enter"]');
  sendBtn.textContent = t('send');
  tips.sendLine = t('send');
  sendBtn.dataset.tip = t('send');
  enterBtn.dataset.tip = t('sendEnter');
  sendBtn.onclick = () => { void sendLine(); line.focus(); };
  enterBtn.onclick = () => { void sendKeys(['enter']); line.focus(); };

  let lastEnterAt = 0;
  // 草稿全部本地编辑：只把 Enter 变成「发送整行」，其余按键不触碰远端 pane。
  // Ctrl+C 只在草稿为空时作为中断手段，避免误伤本地编辑。
  function handleKey(e, phase) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastEnterAt < 400) return;
      lastEnterAt = now;
      void debugLog('enter-' + phase, {});
      void sendLine();
      return;
    }
    if (e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase() === 'c' && !line.value) {
      e.preventDefault();
      void sendKeys(['ctrl+c']);
    }
  }
  line.addEventListener('keydown', e => {
    if (line.dataset.logged !== '1') { line.dataset.logged = '1'; void debugLog('keydown', { key: e.key, composing: e.isComposing }); }
    handleKey(e, 'down');
  });
  // 宿主可能吞元素级按键：仅在焦点不在输入行时兜底 Enter
  const docKeydown = e => {
    if (!document.querySelector('.term-modal')) return;
    if (e.target === line) return;
    if (e.target instanceof HTMLElement && e.target.closest('.term-modal')) return;
    handleKey(e, 'doc');
  };
  window.__kanbanDocKey = docKeydown;
  document.addEventListener('keydown', docKeydown, true);
  modal.querySelector('.term-wrap').onclick = e => { if (!(e.target instanceof HTMLInputElement)) line.focus(); };
  let copyTimer = null;
  async function copySelection() {
    const sel = window.getSelection();
    const text = sel?.toString() ?? '';
    if (!text.trim()) return;
    try {
      await navigator.clipboard.writeText(text);
      toast(t('copied'));
    } catch { /* clipboard blocked */ }
  }
  body.addEventListener('mouseup', () => { clearTimeout(copyTimer); copyTimer = setTimeout(copySelection, 120); });
  body.addEventListener('dblclick', () => { clearTimeout(copyTimer); copyTimer = setTimeout(copySelection, 120); });
  modal.querySelector('[data-act="refresh"]').onclick = load;
  modal.querySelector('[data-act="focus"]').onclick = async () => {
    await call('board_open', { kind: 'pane', id: paneId });
    toast(t('focusedPane'));
  };
  modal.querySelector('[data-act="close"]').onclick = closePaneModal;
  modal.onclick = e => { if (e.target === modal) closePaneModal(); };
  document.body.append(modal);
  line.focus();
  void debugLog('modal-open', { paneId });
  await load();
  // 读取期间弹窗可能已被关闭：此时不再启动轮询。
  if (document.body.contains(modal)) termTimer = setInterval(load, 2000);
}
function closePaneModal() {
  if (termTimer) { clearInterval(termTimer); termTimer = null; }
  if (window.__kanbanDocKey) { document.removeEventListener('keydown', window.__kanbanDocKey, true); window.__kanbanDocKey = null; }
  document.querySelector('.term-modal')?.remove();
}

function card(title, { metas = [], badges = [], cwd = '', agent = null, open = null } = {}) {
  const el = document.createElement('div');
  el.className = 'card';
  if (open) el.onclick = () => openTarget(open.kind, open.id);
  const top = document.createElement('div'); top.className = 'topline';
  if (agent) {
    const av = document.createElement('span'); av.className = 'avatar';
    av.style.background = agentColor(agent); av.textContent = agentInitial(agent);
    top.append(av);
  }
  const ttl = document.createElement('div'); ttl.className = 't'; ttl.textContent = title; top.append(ttl);
  if (open) { const h = document.createElement('span'); h.className = 'open-hint'; h.textContent = '→'; top.append(h); }
  el.append(top);
  if (badges.length) {
    const g = document.createElement('div');
    for (const x of badges) {
      const s = document.createElement('span');
      s.className = 'badge' + (typeof x === 'object' && x.tone ? ' ' + x.tone : '');
      s.textContent = typeof x === 'object' ? x.text : x;
      g.append(s);
    }
    el.append(g);
  }
  if (metas.length) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = metas.join(' · '); el.append(m); }
  if (cwd) { const c = document.createElement('div'); c.className = 'cwd'; c.textContent = shortPath(cwd); el.append(c); }
  return el;
}

const KIND_KEY = { running: 'running', blocked: 'blocked', queued: 'queued', idle: 'idle' };

function renderBoard(groups) {
  board.textContent = '';
  summary.textContent = '';
  for (const kind of ['running', 'blocked', 'queued', 'idle']) {
    const cards = groups[kind] ?? [];
    const col = document.createElement('section');
    col.className = 'col'; col.dataset.kind = kind;
    const head = document.createElement('div'); head.className = 'col-head';
    head.innerHTML = `${ICONS[kind]}<span class="col-title"></span><span class="count"></span>`;
    head.querySelector('.col-title').textContent = t(KIND_KEY[kind]);
    head.querySelector('.count').textContent = cards.length || '';
    col.append(head);
    if (!cards.length) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('none'); col.append(e);
    } else for (const c of cards) col.append(c);
    board.append(col);
    const pill = document.createElement('span'); pill.className = 'pill';
    pill.innerHTML = `${ICONS[kind]}<span></span>`;
    pill.querySelector('span').textContent = `${t(KIND_KEY[kind])} ${cards.length}`;
    summary.append(pill);
  }
}

function cindyGroups(d) {
  const g = { running: [], blocked: [], queued: [], idle: [] };
  for (const c of d.companions ?? []) {
    const el = card(c.name, {
      metas: [c.workingPhase ?? c.phase ?? '', c.summary ?? '', fmt(c.lastReplyAt)].filter(Boolean),
      badges: c.deviceName ? [{ text: c.deviceName }] : [],
      agent: c.name, open: { kind: 'companion', id: c.id },
    });
    if (!c.online || c.status === 'offline') g.idle.push(el);
    else if (c.status === 'awaiting' || c.status === 'error') g.blocked.push(el);
    else if (c.status === 'running') g.running.push(el);
    else g.idle.push(el);
    for (const i of c.interactions ?? []) {
      g.queued.push(card(`${c.name}: ${i.title ?? i.kind}`, {
        badges: [{ text: i.kind === 'permission' ? 'permission' : i.kind === 'question' ? 'question' : i.kind === 'plan' ? 'plan' : i.kind, tone: 'warn' }],
        open: { kind: 'companion', id: c.id },
      }));
    }
  }
  for (const p of d.projects ?? []) {
    for (const task of p.tasks ?? []) {
      const el = card(task.title, { metas: [fmt(task.lastActivityAt)], badges: [{ text: p.label }], open: { kind: 'task', id: task.id } });
      if (task.status === 'running') g.running.push(el);
      else if (task.status === 'awaiting' || task.status === 'error') g.blocked.push(el);
      else g.idle.push(el);
    }
  }
  return g;
}

function herdrGroups(d) {
  const g = { running: [], blocked: [], queued: [], idle: [] };
  const idleAsBusy = d.herdrIdleAsBusy === true;
  for (const a of d.herdrAgents ?? []) {
    const badges = [{ text: a.agent }, { text: a.paneId }];
    if (a.status === 'idle') badges.push({ text: idleAsBusy ? t('standbyBusy') : t('standby'), tone: 'warn' });
    if (a.status === 'done') badges.push({ text: t('done') });
    const el = card(a.title || a.paneId, { badges, cwd: a.cwd, agent: a.agent });
    el.onclick = () => openPaneModal(a.paneId, a.title || a.paneId);
    if (a.status === 'working') g.running.push(el);
    else if (a.status === 'blocked') g.blocked.push(el);
    else if (a.status === 'idle' && idleAsBusy) g.running.push(el);
    else g.idle.push(el);
  }
  return g;
}

function renderAgents(d) {
  agentsBox.textContent = '';
  const sections = [
    { title: t('cindyCompanions'), items: (d.companions ?? []).map(c => ({ ...c, tasks: c.tasks ?? [{ id: c.id, title: t('mission'), status: c.status }] })), kind: 'cindy' },
    { title: t('herdrAgents'), items: groupHerdr(d.herdrAgents ?? []), kind: 'herdr' },
  ];
  for (const sec of sections) {
    if (!sec.items.length) continue;
    const h = document.createElement('div'); h.className = 'section-title'; h.textContent = sec.title; agentsBox.append(h);
    for (const a of sec.items) {
      const group = document.createElement('div'); group.className = 'agent-group';
      const head = document.createElement('div'); head.className = 'agent-head';
      const av = document.createElement('span'); av.className = 'avatar';
      av.style.background = agentColor(sec.kind === 'herdr' ? a.agent : a.name);
      av.textContent = agentInitial(sec.kind === 'herdr' ? a.agent : a.name);
      const name = document.createElement('span'); name.className = 'name';
      name.textContent = sec.kind === 'herdr' ? a.agent : a.name;
      const count = document.createElement('span'); count.className = 'pill';
      count.textContent = t('tasks', { n: (a.tasks ?? []).length });
      head.append(av, name, count);
      if (sec.kind === 'cindy' && a.device) {
        const dev = document.createElement('span'); dev.className = 'pill'; dev.textContent = a.device; head.append(dev);
      }
      group.append(head);
      const grid = document.createElement('div'); grid.className = 'agent-tasks';
      for (const task of a.tasks ?? []) {
        const st = document.createElement('div'); st.className = 'subtask';
        st.textContent = task.title || task.id;
        const m = document.createElement('div'); m.className = 'st';
        m.textContent = [task.status, task.cwd ? shortPath(task.cwd) : ''].filter(Boolean).join(' · ');
        st.append(m);
        st.onclick = () => openTarget(sec.kind === 'herdr' ? 'pane' : 'companion', task.id);
        grid.append(st);
      }
      if (!(a.tasks ?? []).length) {
        const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('noTasks'); grid.append(e);
      }
      group.append(grid);
      agentsBox.append(group);
    }
  }
  if (!agentsBox.children.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('noAgents'); agentsBox.append(e);
  }
}

function groupHerdr(list) {
  const map = new Map();
  for (const a of list) {
    const key = a.agent || 'unknown';
    if (!map.has(key)) map.set(key, { agent: key, tasks: [] });
    const statusLabel = a.status === 'idle' ? t('standby') : a.status === 'done' ? t('done') : a.status;
    map.get(key).tasks.push({ id: a.paneId, title: a.title, status: statusLabel, cwd: a.cwd });
  }
  return [...map.values()];
}

function render(d) {
  if (view === 'policy') return;
  if (view === 'agent') { board.classList.add('hidden'); summary.classList.add('hidden'); agentsBox.classList.remove('hidden'); renderAgents(d); }
  else {
    agentsBox.classList.add('hidden');
    board.classList.remove('hidden'); summary.classList.remove('hidden');
    renderBoard(view === 'herdr' ? herdrGroups(d) : cindyGroups(d));
  }
  const herdrNote = d.herdrAgents === null ? t('herdrOff') : '';
  status.textContent = t('updated', { t: fmt(d.observedAt) }) + herdrNote + (d.errors?.length ? '\n' + d.errors.join('\n') : '');
}

const REFRESH_MS = 15000;
let nextRefreshAt = Date.now() + REFRESH_MS;
function tickCountdown() {
  const el = document.querySelector('#countdown');
  if (!el) return;
  const left = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
  el.textContent = `${left}s`;
  el.title = t('autoRefreshTip', { n: REFRESH_MS / 1000 });
  if (left <= 0) {
    nextRefreshAt = Date.now() + REFRESH_MS;
    if (!document.querySelector('.term-modal') && !document.body.classList.contains('patrolling')) void refresh();
  }
}
setInterval(tickCountdown, 1000);

async function refresh() {
  nextRefreshAt = Date.now() + REFRESH_MS;
  status.textContent = t('loading');
  document.body.classList.add('patrolling');
  try {
    last = await call('board_snapshot', {});
    if (last) document.querySelector('#idle-busy').checked = last.herdrIdleAsBusy === true;
    render(last);
    await loadPolicy(last);
  } catch (e) { status.textContent = t('readFailed', { e: e?.message ?? e }); }
  finally { document.body.classList.remove('patrolling'); }
}

const WD_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
const wdBox = document.querySelector('#sched-weekdays');
for (let i = 0; i < 7; i++) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.d = String(i); b.textContent = WD_NAMES[i];
  b.onclick = () => b.classList.toggle('on');
  wdBox.append(b);
}
function selectedWeekdays() {
  return [...wdBox.querySelectorAll('button.on')].map(b => Number(b.dataset.d));
}

const dirty = { policy: false, patrol: false };
for (const id of ['#policy-text', '#patrol-text']) {
  const el = document.querySelector(id);
  el.addEventListener('input', () => { dirty[id === '#policy-text' ? 'policy' : 'patrol'] = true; });
}

async function loadPolicy(d) {
  try {
    const r = await call('board_policy', { op: 'get' });
    if (!dirty.policy) document.querySelector('#policy-text').value = r.policy ?? '';
    if (!dirty.patrol) document.querySelector('#patrol-text').value = r.patrol ?? '';
    const box = document.querySelector('#reports');
    box.textContent = '';
    const reports = r.reports ?? [];
    if (!reports.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('noReports'); box.append(e); }
    for (const rp of reports) {
      const el = document.createElement('div'); el.className = 'report';
      const v = document.createElement('div'); v.className = 'v'; v.textContent = rp.verdict || '—'; el.append(v);
      if (rp.basis) { const b = document.createElement('div'); b.className = 'b'; b.textContent = rp.basis; el.append(b); }
      const time = document.createElement('div'); time.className = 't'; time.textContent = fmt(rp.at); el.append(time);
      box.append(el);
    }
  } catch { /* ignore */ }
  const sel = document.querySelector('#auto-companion');
  const chosen = sel.value;
  sel.textContent = '';
  const first = document.createElement('option'); first.value = ''; first.textContent = t('companionPick'); sel.append(first);
  for (const c of d.companions ?? []) {
    const o = document.createElement('option'); o.value = c.name; o.textContent = c.name; sel.append(o);
  }
  if (chosen && [...sel.options].some(o => o.value === chosen)) sel.value = chosen;
}

async function loadSchedule() {
  const box = document.querySelector('#sched-status');
  try {
    const r = await call('board_schedule_get', {});
    if (!r.ok) { box.textContent = r.message ?? ''; return; }
    if (!r.found) { box.textContent = t('noSchedule'); return; }
    if (r.intervalMs) {
      document.querySelector('#sched-mode').value = 'interval';
      if (r.intervalMs % 3600000 === 0) { document.querySelector('#sched-every').value = r.intervalMs / 3600000; document.querySelector('#sched-unit').value = 'hours'; }
      else { document.querySelector('#sched-every').value = Math.max(1, Math.round(r.intervalMs / 60000)); document.querySelector('#sched-unit').value = 'minutes'; }
    } else if (r.cronExpr && /^\d+ \*(\/\d+)? \* \* \*$/.test(r.cronExpr)) {
      const parts = r.cronExpr.split(' ');
      const step = parts[1].startsWith('*/') ? Number(parts[1].slice(2)) : 1;
      document.querySelector('#sched-mode').value = 'interval';
      document.querySelector('#sched-every').value = step;
      document.querySelector('#sched-unit').value = 'hours';
    } else if (r.cronExpr) {
      const parts = r.cronExpr.split(' ');
      if (parts.length === 5 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) {
        document.querySelector('#sched-mode').value = parts[4] === '*' ? 'daily' : 'weekly';
        document.querySelector('#sched-time').value = `${parts[1].padStart(2, '0')}:${parts[0].padStart(2, '0')}`;
        if (parts[4] !== '*') {
          const days = parts[4].split(',').map(Number);
          for (const b of wdBox.querySelectorAll('button')) b.classList.toggle('on', days.includes(Number(b.dataset.d)));
        }
      } else if (parts.length === 5 && parts[0].startsWith('*/')) {
        document.querySelector('#sched-mode').value = 'interval';
        document.querySelector('#sched-every').value = Number(parts[0].slice(2)) || 30;
        document.querySelector('#sched-unit').value = 'minutes';
      }
    }
    document.querySelector('#sched-enabled').checked = r.status === 'active';
    syncScheduleInputs();
    const freq = r.intervalMs ? `${r.intervalMs / 60000} min` : r.cronExpr;
    box.textContent = t('current', {
      name: r.name, freq, tz: r.timezone,
      state: r.status === 'active' ? t('active') : t('paused'),
      next: r.nextFireAt ? t('nextAt', { t: fmt(r.nextFireAt) }) : '',
    });
  } catch (e) { box.textContent = t('readFailed', { e: e?.message ?? e }); }
}

function syncScheduleInputs() {
  const p = document.querySelector('#sched-mode').value;
  document.querySelector('#sched-interval-row').style.display = p === 'interval' ? 'flex' : 'none';
  document.querySelector('#sched-time').classList.toggle('hidden', p === 'interval');
  document.querySelector('#sched-weekly-row').classList.toggle('hidden', p !== 'weekly');
}

for (const [id, v] of [['v-cindy', 'cindy'], ['v-herdr', 'herdr'], ['v-agent', 'agent'], ['v-policy', 'policy']]) {
  document.querySelector(`#${id}`).onclick = () => {
    view = v;
    for (const [x, k] of [['v-cindy', 'cindy'], ['v-herdr', 'herdr'], ['v-agent', 'agent'], ['v-policy', 'policy']])
      document.querySelector(`#${x}`).classList.toggle('on', k === v);
    policyBox.classList.toggle('hidden', v !== 'policy');
    if (v === 'policy') {
      board.classList.add('hidden'); summary.classList.add('hidden'); agentsBox.classList.add('hidden');
      if (last) loadPolicy(last);
      void loadSchedule();
    } else if (last) render(last);
  };
}

document.querySelector('#sched-mode').onchange = syncScheduleInputs;

document.querySelector('#sched-apply').onclick = async () => {
  const btn = document.querySelector('#sched-apply'); btn.disabled = true;
  try {
    const r = await call('board_schedule_apply', {
      mode: document.querySelector('#sched-mode').value,
      every: Number(document.querySelector('#sched-every').value),
      unit: document.querySelector('#sched-unit').value,
      time: document.querySelector('#sched-time').value,
      weekdays: selectedWeekdays(),
      enabled: document.querySelector('#sched-enabled').checked,
    });
    if (r.ok) { toast(t('planApplied')); await loadSchedule(); }
    else toast(t('planFailed', { e: r.message ?? '' }), true);
  } catch (e) { toast(t('planFailed', { e: e?.message ?? e }), true); }
  btn.disabled = false;
};

document.querySelector('#idle-busy').onchange = async () => {
  const on = document.querySelector('#idle-busy').checked;
  if (last) { last.herdrIdleAsBusy = on; render(last); }
  try {
    const r = await call('board_policy', { op: 'set', herdrIdleAsBusy: on });
    if (!r.ok) toast(t('saveFailed', { e: '' }), true);
  } catch (e) { toast(t('saveFailed', { e: e?.message ?? e }), true); }
};

document.querySelector('#policy-save').onclick = async () => {
  const text = document.querySelector('#policy-text').value.trim();
  const btn = document.querySelector('#policy-save'); btn.disabled = true;
  try {
    const r = await call('board_policy', { op: 'set', policy: text });
    if (r.ok) dirty.policy = false;
    status.textContent = r.ok ? t('savedPolicy') : t('saveFailed', { e: r.message ?? '' });
  } catch (e) { status.textContent = t('saveFailed', { e: e?.message ?? e }); }
  btn.disabled = false;
};

document.querySelector('#patrol-save').onclick = async () => {
  const text = document.querySelector('#patrol-text').value.trim();
  try {
    const r = await call('board_policy', { op: 'set', patrol: text });
    if (r.ok) dirty.patrol = false;
    status.textContent = r.ok ? t('savedPolicy') : t('saveFailed', { e: r.message ?? '' });
  } catch (e) { status.textContent = t('saveFailed', { e: e?.message ?? e }); }
};

document.querySelector('#patrol-now').onclick = async () => {
  const btn = document.querySelector('#patrol-now'); btn.disabled = true;
  const out = document.querySelector('#patrol-result');
  out.classList.remove('hidden');
  document.body.classList.add('patrolling');
  out.textContent = t('analyzing');
  try {
    const r = await call('board_analyze', { focus: document.querySelector('#patrol-text').value.trim(), route });
    out.textContent = r.ok ? (r.analysis || '—') : t('analyzeFailed', { e: r.message ?? r.status ?? '' });
    last = await call('board_snapshot', {});
    if (last) { render(last); await loadPolicy(last); }
  } catch (e) { out.textContent = t('analyzeFailed', { e: e?.message ?? e }); }
  document.body.classList.remove('patrolling');
  btn.disabled = false;
};

document.querySelector('#pick-model').onclick = async () => {
  try {
    const r = await call('board_pick_model', {});
    if (r.ok) {
      route = r.route;
      document.querySelector('#model-label').textContent = r.label ?? t('defaultModel');
      document.querySelector('#patrol-model').textContent = r.label ?? t('defaultModel');
    }
  } catch { /* ignore */ }
};

document.querySelector('#analyze').onclick = async () => {
  const btn = document.querySelector('#analyze'); btn.disabled = true;
  const out = document.querySelector('#analyze-result');
  out.classList.remove('hidden'); out.textContent = t('analyzing');
  try {
    const r = await call('board_analyze', { focus: document.querySelector('#analyze-focus').value.trim(), route });
    out.textContent = r.ok ? (r.analysis || '—') : t('analyzeFailed', { e: r.message ?? r.status ?? '' });
  } catch (e) { out.textContent = t('analyzeFailed', { e: e?.message ?? e }); }
  btn.disabled = false;
};

document.querySelector('#automate').onclick = async () => {
  const btn = document.querySelector('#automate'); btn.disabled = true;
  const out = document.querySelector('#automate-result');
  out.classList.remove('hidden'); out.textContent = t('automating');
  try {
    const r = await call('board_automate', {
      purpose: document.querySelector('#auto-purpose').value.trim(),
      intervalMs: Number(document.querySelector('#auto-interval').value),
      companionName: document.querySelector('#auto-companion').value,
      route,
    });
    out.textContent = r.ok ? `${r.note}\n\n${r.name}\n\n${r.prompt}` : t('saveFailed', { e: r.message ?? '' });
  } catch (e) { out.textContent = t('saveFailed', { e: e?.message ?? e }); }
  btn.disabled = false;
};

document.querySelector('#chat-send').onclick = sendChat;
document.querySelector('#chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

app.onhostcontextchanged = () => {
  const locale = normalizeLocale(app.getHostContext()?.locale);
  if (locale !== LOCALE) {
    LOCALE = locale;
    applyStatic();
    if (last) render(last);
  }
};
app.onteardown = async () => ({});
document.querySelector('#refresh').onclick = refresh;

try {
  await app.connect();
  LOCALE = normalizeLocale(app.getHostContext()?.locale);
  applyStatic();
  document.querySelector('#refresh').disabled = false;
  await refresh();
  await loadChat();
} catch { status.textContent = t('notConnected'); }
</script>
</html>
