<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reading.css"><link rel="stylesheet" href="view.css"><title>Podcast Insights</title></head><body>
<header class="library-header">
<div class="library-heading"><h1 data-i18n="title"></h1><div class="library-heading-actions"><button id="clear" class="quiet-action" data-i18n="clearLibrary"></button></div></div>
<form id="import"><label for="url" data-i18n="link"></label><div class="import-row"><input id="url" type="url" required><button data-i18n="import"></button></div></form>
</header>
<p id="notice" role="status" aria-live="polite"></p><p class="muted model-disclosure" data-i18n="modelDisclosure"></p>
<section class="minutes-index" aria-labelledby="minutes-index-title"><h2 id="minutes-index-title" data-i18n="minutesOpen"></h2><div id="minutes-list"></div></section>
<main><aside><h2 data-i18n="shows"></h2><div id="shows"></div><p id="space" class="muted"></p></aside>
<section><h2 data-i18n="episodes"></h2><select id="state" aria-label="Transcript state"><option value="" data-i18n="allStates"></option><option value="ready" data-i18n="ready"></option><option value="none" data-i18n="none"></option><option value="remote_available" data-i18n="remote_available"></option><option value="transcribing" data-i18n="transcribing"></option><option value="failed" data-i18n="failed"></option></select><div id="episodes"></div><button id="more-episodes" hidden data-i18n="more"></button></section>
<article><h2 id="episode-title" data-i18n="reader"></h2><div id="episode-actions" hidden><button id="minutes-open" data-i18n="minutesOpen"></button><button id="cloud" data-i18n="cloud"></button><button id="delete-episode" data-i18n="deleteEpisode"></button><label><span data-i18n="file"></span><input id="file" type="file" accept=".json,.vtt,.srt,.txt,.md,.html"></label></div><form id="search"><label><span data-i18n="query"></span><input id="query" required maxlength="300"></label><button data-i18n="search"></button></form><div id="reader"></div><button id="more" hidden data-i18n="more"></button><div class="notes-section"><h2 data-i18n="notes"></h2><div id="notes"></div><button id="more-notes" hidden data-i18n="moreNotes"></button><button id="export" data-i18n="exportSelected"></button><p class="muted" data-i18n="citeBoundary"></p></div></article></main>
<script src="reading.js"></script><script src="ui.js"></script><script src="view.js"></script></body></html>
