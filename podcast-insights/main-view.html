<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="view.css"><title>Podcast Insights</title></head><body>
<header><h1 data-i18n="title"></h1><form id="import"><label><span data-i18n="link"></span><input id="url" type="url" required></label><button data-i18n="import"></button></form><button id="clear" data-i18n="clearLibrary"></button></header>
<p id="notice" role="status" aria-live="polite"></p><p class="muted" data-i18n="modelDisclosure"></p>
<main><aside><h2 data-i18n="shows"></h2><div id="shows"></div><p id="space" class="muted"></p></aside>
<section><h2 data-i18n="episodes"></h2><select id="state" aria-label="Transcript state"><option value="" data-i18n="allStates"></option><option value="ready" data-i18n="ready"></option><option value="none" data-i18n="none"></option><option value="remote_available" data-i18n="remote_available"></option><option value="transcribing" data-i18n="transcribing"></option><option value="failed" data-i18n="failed"></option></select><div id="episodes"></div><button id="more-episodes" hidden data-i18n="more"></button></section>
<article><h2 id="episode-title" data-i18n="reader"></h2><div id="episode-actions" hidden><button id="cloud" data-i18n="cloud"></button><button id="delete-episode" data-i18n="deleteEpisode"></button><label><span data-i18n="file"></span><input id="file" type="file" accept=".json,.vtt,.srt,.txt,.md,.html"></label></div><form id="search"><label><span data-i18n="query"></span><input id="query" required maxlength="300"></label><button data-i18n="search"></button></form><div id="reader"></div><button id="more" hidden data-i18n="more"></button><h2 data-i18n="notes"></h2><div id="notes"></div><button id="more-notes" hidden data-i18n="moreNotes"></button><button id="export" data-i18n="exportSelected"></button><p class="muted" data-i18n="citeBoundary"></p></article></main>
<script src="ui.js"></script><script src="view.js"></script></body></html>
