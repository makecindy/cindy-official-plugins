<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="settings.css"></head>
<body>
<header><img src="assets/icon.png" width="44" height="44" alt=""><div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><span class="version"></span></header>
<section class="connection"><div class="status-line"><span id="dot" class="dot"></span><strong id="status" role="status" aria-live="polite"></strong><button id="refresh" class="quiet" data-i18n="refresh"></button></div><p id="diagnostic"></p><div id="client-guide" class="client-guide" hidden><strong data-i18n="clientGuideTitle"></strong><p data-i18n="clientGuideBody"></p><ol><li data-i18n="clientGuideStep1"></li><li data-i18n="clientGuideStep2"></li><li data-i18n="clientGuideStep3"></li></ol><p class="muted" data-i18n="clientGuideNote"></p></div></section>
<section id="install"><h2 data-i18n="installTitle"></h2><p data-i18n="installFlow"></p><div id="browsers" class="browser-grid"></div><p id="install-hint" role="status" aria-live="polite"></p><ol id="store-steps"><li data-i18n="storeStep1"></li><li data-i18n="storeStep2"></li></ol><p class="muted" data-i18n="storeNote"></p><div id="profiles"></div></section>
<details id="developer"><summary data-i18n="developer"></summary><p data-i18n="developerWarning"></p><div class="add-row"><select id="dev-browser" aria-label="Development browser"><option value="chrome">Chrome</option><option value="edge">Edge</option></select><button id="dev-open" data-i18n="devOpen"></button><button id="dev-reload" data-i18n="devReload"></button></div><ol><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><div class="path"><input id="extdir" readonly aria-label="Development extension directory"><button id="copy" data-i18n="copy"></button></div><p class="muted" data-i18n="updateHint"></p></details>
<footer><span id="hint" role="status" aria-live="polite"></span></footer>
<p class="privacy" data-i18n="privacy"></p>
<script src="extension/ui.js"></script><script src="settings.js"></script>
</body></html>
