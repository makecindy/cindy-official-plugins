<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="settings.css"></head>
<body>
<header><img src="assets/icon.png" width="44" height="44" alt=""><div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><span class="version">0.3.7</span></header>
<section class="connection"><div class="status-line"><span id="dot" class="dot"></span><strong id="status" role="status" aria-live="polite"></strong><button id="refresh" class="quiet" data-i18n="refresh"></button></div><p id="diagnostic"></p></section>
<section id="install"><h2 data-i18n="installTitle"></h2><p data-i18n="installFlow"></p><div id="browsers" class="browser-grid"></div><p id="install-hint" role="status" aria-live="polite"></p><ol id="zip-steps"><li data-i18n="zipStep1"></li><li data-i18n="zipStep2"></li><li data-i18n="zipStep3"></li></ol><p class="muted" data-i18n="zipNote"></p><div id="profiles"></div></section>
<details id="developer"><summary data-i18n="developer"></summary><p data-i18n="developerWarning"></p><div class="add-row"><select id="dev-browser" aria-label="Development browser"><option value="chrome">Chrome</option><option value="edge">Edge</option></select><button id="dev-open" data-i18n="devOpen"></button><button id="dev-reload" data-i18n="devReload"></button></div><ol><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><div class="path"><input id="extdir" readonly aria-label="Development extension directory"><button id="copy" data-i18n="copy"></button></div><p class="muted" data-i18n="updateHint"></p></details>
<section><h2 data-i18n="interactTitle"></h2><p data-i18n="interactBody"></p><label><input type="checkbox" id="all-sites"> <span data-i18n="allSites"></span></label><div id="site-selection"><div id="interact-list" class="chips"></div><div class="add-row"><input id="interact-input" data-i18n-ph="hostPlaceholder" aria-label="Interaction domain" autocomplete="off" spellcheck="false"><button id="interact-add" data-i18n="add"></button></div></div></section>
<details><summary data-i18n="readTitle"></summary><p data-i18n="readBody"></p><div id="read-list" class="chips"></div><div class="add-row"><input id="read-input" data-i18n-ph="hostPlaceholder" aria-label="Blocked domain" autocomplete="off" spellcheck="false"><button id="read-add" data-i18n="add"></button></div><p id="exclusions" class="muted"></p></details>
<footer><button id="save" class="primary" disabled data-i18n="save"></button><span id="hint" role="status" aria-live="polite"></span></footer>
<p class="privacy" data-i18n="privacy"></p>
<script src="extension/policy.js"></script><script src="settings.js"></script>
</body></html>
