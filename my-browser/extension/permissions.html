<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindy</title>
<style>
:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--bg:#fff;--line:#d2d2d7;--accent:#d93a3a}
@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--bg:#1c1c1e;--line:#3a3a3c}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:56px auto;padding:0 24px}
section{padding:0}
h1{font-size:20px;margin:0 0 10px}p{margin:0 0 12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.status{flex:1;min-width:200px;color:var(--fg)}
button{font:inherit;border-radius:8px;padding:7px 16px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button[hidden]{display:none}
</style></head><body><main>
<section id="groups-section"><h1 id="group-title"></h1><p id="group-intro"></p>
<div class="row"><span class="status" id="group-status" role="status" aria-live="polite"></span><button class="primary" id="group-allow" hidden></button><button id="group-revoke" hidden></button></div></section>
</main><script src="permissions.js"></script></body></html>
