<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="subtle" data-i18n="subtle"></p>
    </div>
    <span id="stateBadge" class="badge" data-i18n="badgeDisconnected"></span>
  </header>

  <section id="connectedCard" class="connected-card" hidden>
    <div class="account-mark" aria-hidden="true">i</div>
    <div class="account-copy">
      <strong id="connectedEmail"></strong>
      <span data-i18n="connectedNote"></span>
    </div>
    <button id="disconnect" class="secondary compact" type="button" data-i18n="disconnect"></button>
  </section>

  <form id="connectForm">
    <label for="email" data-i18n="emailLabel"></label>
    <input id="email" name="email" type="email" inputmode="email"
      autocomplete="username" placeholder="example@icloud.com" maxlength="254">

    <label for="appSpecificPassword" data-i18n="passwordLabel"></label>
    <div class="secret-row">
      <input id="appSpecificPassword" name="appSpecificPassword" type="password"
        autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" maxlength="128">
      <button id="toggleSecret" class="secondary compact" type="button"
        data-i18n="show" data-i18n-aria-label="showAria"></button>
    </div>

    <p class="help"><span data-i18n="helpBefore"></span><a href="https://account.apple.com/" target="_blank" rel="noreferrer" data-i18n="helpLink"></a><span data-i18n="helpAfter"></span></p>

    <button id="connect" class="primary" type="submit" data-i18n="connect"></button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <aside data-i18n="privacyNote"></aside>

  <script src="/settings.js"></script>
</body>
</html>
