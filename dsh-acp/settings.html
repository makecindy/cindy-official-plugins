<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Colours come from the tokens Cindy injects (they follow Light / Dark and custom
     themes). Fallbacks are only for an old host. The page background and
     color-scheme are left to the host on purpose. */
  body {
    margin: 0;
    padding: 16px;
    font: 13px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary, #1a1a1a);
  }
  [hidden] { display: none !important; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { font-size: 14px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    height: 22px; padding: 0 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: var(--surface-chip, #efefec);
    color: var(--text-secondary, #5c5c58);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge[data-tone="success"] { color: var(--status-success, #2f7d4f); }
  .badge[data-tone="error"] { color: var(--error-fg, #b42318); }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0 0; }
  .facts dt { color: var(--text-secondary, #5c5c58); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .note { margin: 12px 0 0; color: var(--text-secondary, #5c5c58); }
  .note[data-tone="error"] { color: var(--error-fg, #b42318); }
  .detail { margin: 8px 0 0; color: var(--text-tertiary, #8a8a86); font-size: 12px; overflow-wrap: anywhere; }
  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 16px 0 0; }
  button {
    height: 32px; padding: 0 24px; border-radius: 999px;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500; cursor: pointer;
    transition: background-color var(--motion-fast, 120ms) var(--motion-ease-out, ease-out);
  }
  button:hover:not(:disabled) { background: var(--surface-chip, #efefec); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--focus-ring, #4c8bf5); outline-offset: 2px; }
  .foot { margin: 16px 0 0; color: var(--text-tertiary, #8a8a86); font-size: 12px; }
  .key {
    margin: 20px 0 0; padding: 16px 0 0;
    border-top: 1px solid var(--border-default, #e4e4e0);
  }
  .key-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .key-title { font-weight: 600; }
  .key-status { color: var(--text-secondary, #5c5c58); font-size: 12px; text-align: right; }
  .key-status[data-tone="success"] { color: var(--status-success, #2f7d4f); }
  .key-status[data-tone="warning"] { color: var(--warning-fg, #b54708); }
  .key-form { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .key-form input {
    flex: 1 1 220px; min-width: 0; height: 32px; padding: 0 12px; box-sizing: border-box;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 8px;
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .key-form input::placeholder {
    color: var(--text-tertiary, #8a8a86);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .key-form input:focus-visible { outline: 2px solid var(--focus-ring, #4c8bf5); outline-offset: 1px; }
  .key-help { margin: 8px 0 0; color: var(--text-secondary, #5c5c58); font-size: 12px; }
  .harness-usage { margin-top: 18px; border-top: 1px solid var(--border-default, GrayText); padding-top: 12px; }
  .harness-usage h2 { margin: 0; font: inherit; font-weight: 600; }
  .harness-usage dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 12px; margin: 10px 0; }
  .harness-usage dl[hidden] { display: none; }
  .harness-usage dt, .harness-usage dd { margin: 0; overflow-wrap: anywhere; }
  .harness-usage dd { text-align: end; font-variant-numeric: tabular-nums; }
  .harness-usage small { display: block; margin-top: 6px; color: var(--text-secondary, GrayText); }
  .cli-version-label { display: flex; align-items: center; align-self: start; min-height: 32px; }
  dd.cli-version { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  button.cli-refresh { display: inline-grid; place-items: center; padding: 0; width: 32px; height: 32px; border: 0; border-radius: 999px; }
  #cli-maintenance { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #cli-status { color: var(--text-secondary, GrayText); }
  /* Install progress, laid out like Cindy's download meter: step and percent, a 4px bar when the
     size is known, then the current detail with speed or elapsed time. No looping animation. */
  /* Each takes a line of its own under the version; only the content is width-capped. */
  .cli-progress, .cli-log { flex: 0 0 100%; min-width: 0; }
  .cli-progress > *, .cli-log > * { max-width: 520px; }
  .cli-progress { margin: 2px 0; }
  .cli-progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .cli-progress-row > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cli-progress-head { font-size: 12px; color: var(--text-secondary, GrayText); }
  .cli-progress-foot { margin-top: 2px; font-size: 11px; color: var(--text-tertiary, GrayText); }
  .cli-num { flex: none; font-variant-numeric: tabular-nums; color: var(--text-tertiary, GrayText); }
  .cli-progress-bar { height: 4px; margin: 6px 0 4px; border-radius: 999px; overflow: hidden; background: var(--surface-chip, rgba(128, 128, 128, 0.2)); }
  .cli-progress-bar > div { width: 0; height: 100%; border-radius: inherit; background: var(--text-primary, CanvasText); transition: width 150ms var(--motion-ease-out, ease-out); }
  .cli-log { margin: 2px 0; font-size: 12px; }
  .cli-log summary { width: max-content; max-width: 100%; cursor: pointer; border-radius: 4px; color: var(--text-secondary, GrayText); }
  .cli-log summary:focus-visible { outline: 2px solid var(--focus-ring, Highlight); outline-offset: 2px; }
  .cli-log pre {
    margin: 6px 0 0; max-height: 180px; overflow: auto; padding: 8px 10px; box-sizing: border-box;
    border: 1px solid var(--border-default, GrayText); border-radius: 8px;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text-secondary, GrayText); white-space: pre-wrap; overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="title">DeepSeek Harness</div>
    <span class="badge" id="badge" role="status" aria-live="polite"></span>
  </div>

  <dl class="facts">
    <dt id="label-version" class="cli-version-label"></dt><dd class="cli-version">
      <span id="version"></span>
      <button type="button" id="recheck" class="cli-refresh" disabled aria-label="Check CLI version and updates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg>
      </button>
      <div id="cli-maintenance" hidden>
        <button type="button" id="cli-action"></button>
        <span id="cli-status" role="status" aria-live="polite"></span>
      </div>
      <div id="cli-progress" class="cli-progress" hidden>
        <div class="cli-progress-row cli-progress-head"><span id="cli-progress-step" aria-live="polite"></span><span id="cli-progress-percent" class="cli-num"></span></div>
        <div id="cli-progress-bar" class="cli-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><div id="cli-progress-fill"></div></div>
        <div class="cli-progress-row cli-progress-foot"><span id="cli-progress-detail"></span><span id="cli-progress-rate" class="cli-num"></span></div>
      </div>
      <details id="cli-log" class="cli-log" hidden>
        <summary id="cli-log-title"></summary>
        <pre id="cli-log-lines"></pre>
      </details>
    </dd>
    <dt id="label-path"></dt><dd id="path" class="mono"></dd>
  </dl>

  <p class="detail" id="detail" hidden></p>
  <p class="note" id="note" hidden></p>


  <section class="key" id="key-section" hidden>
    <div class="key-head">
      <span class="key-title" id="key-title"></span>
      <span class="key-status" id="key-status" role="status" aria-live="polite"></span>
    </div>
    <form class="key-form" id="key-form" autocomplete="off">
      <input type="password" id="key-input" autocomplete="off" spellcheck="false" placeholder="sk-…">
      <button type="submit" id="key-save"></button>
      <button type="button" id="key-clear" hidden></button>
    </form>
    <p class="key-help" id="key-help"></p>
    <p class="note" id="key-note" hidden></p>
  </section>

  <p class="foot" id="foot"></p>

  <section class="harness-usage" id="harness-usage" data-channel="dsh-acp" data-recheck="recheck" aria-labelledby="harness-usage-title">
    <h2 id="harness-usage-title"></h2><dl hidden></dl><small role="status"></small>
  </section>
  <script src="usage-view.js"></script>
  <script src="cli-settings.js"></script>
  <script src="settings.js"></script>
</body>
</html>
