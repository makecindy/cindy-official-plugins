<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baguette Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#232323;font:14px system-ui;height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #ddd;flex-wrap:wrap}strong{font-size:15px}#status{flex:1;color:#666}button{border:1px solid #ccc;background:white;border-radius:8px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}iframe{flex:1;width:100%;border:0;background:#f5f5f2}#notice{padding:10px 16px;background:#fff3d6;display:none}small{color:#777}</style>
<header><strong>Baguette</strong><span id="status">Connecting...</span><button id="release">Release keys</button><button id="recover">Recover view</button><small>Keeps apps and sign-in data</small></header><div id="notice" role="status"></div><iframe id="screen" title="iOS Simulator" allow="clipboard-read; clipboard-write"></iframe>
<script>
const udid=new URLSearchParams(location.search).get('udid');
const cap=new URLSearchParams(location.hash.slice(1)).get('cindyClipboard');
const token=cap?.split('.')[1];const screen=document.getElementById('screen'),status=document.getElementById('status'),button=document.getElementById('recover'),notice=document.getElementById('notice');
let generation=null,checking=false,recovering=false;
function message(text){notice.textContent=text;notice.style.display=text?'block':'none';}
function load(){screen.src='/simulators/'+encodeURIComponent(udid)+location.hash;}
async function api(action){const r=await fetch('/control-api',{method:'POST',headers:{'Content-Type':'application/json','X-Cindy-Clipboard':token},body:JSON.stringify({action,udid}),signal:AbortSignal.timeout(20000)});const p=await r.json();if(!r.ok)throw Error(p.error||'Connection failed');return p;}
async function check(){if(checking||recovering)return;checking=true;try{const s=await api('status');if(recovering)return;status.textContent=s.ready?'Viewer service connected':s.parked?'Viewer service stopped':'Reconnecting...';message(s.parked?'Automatic recovery stopped. Click Recover view.':'');if(s.ready&&(generation===null||screen.contentDocument?.querySelector('[data-viewer-unavailable]'))){generation=s.generation;load();}}catch{status.textContent='Plugin disconnected';message('Refresh this page. If unavailable, enable Baguette in Cindy Plugins and reopen the viewer.');}finally{checking=false;}}
button.onclick=async()=>{if(recovering)return;recovering=true;button.disabled=true;status.textContent='Recovering view...';message('');screen.src='about:blank';try{const s=await api('restart');generation=s.generation;load();status.textContent='Viewer service connected';}catch{message('Recovery failed. You can retry. If disabled, enable Baguette in Cindy Plugins.');status.textContent='Connection failed';}finally{button.disabled=false;recovering=false;}};
document.getElementById('release').onclick=async function(){this.disabled=true;screen.contentWindow?.postMessage({type:'cindy-release-input'},location.origin);try{await api('release');message('Keys released. Select the input field again.');}catch{message('Key release could not be confirmed. Try releasing keys again.');}finally{this.disabled=false;}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});check();setInterval(check,3000);
</script></html>
