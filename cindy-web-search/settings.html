<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Web Search 自定义设置区(意识自绘,cindy-ghost:// 沙箱页):
     普通偏好走 /kv(只保存非默认 override),Brave / Tavily 两条 key 走 /secrets。
     安全模型:这里只是收单;值经协议 /secrets 一次性交给主机保险库(OS 级加密),
     本页存不下也读不回明文——保存后只有「已保存」状态 + 尾 4 位指纹进占位文案。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  /* 底色不自己铺:主机注入基线 = 设置卡片色,与相邻卡片无缝(FORGE_GUIDE §4.8)。 */
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .preferences {
    padding: 0 2px 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-default, #e4e4e0);
  }
  .preference-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .preference-row + .preference-row { margin-top: 14px; }
  .preference-copy { min-width: 0; }
  .preference-title { font-weight: 500; }
  .hint { margin-top: 3px; color: var(--text-tertiary, #8a8a86); font-size: 12px; }
  .switch { position: relative; width: 36px; height: 20px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-track {
    position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
    background: var(--surface-chip, #d8d8d3);
    transition: background 120ms ease;
  }
  .switch-track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--surface-elevated, #ffffff);
    box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: transform 120ms ease;
  }
  .switch input:checked + .switch-track { background: var(--accent-cta-bg, #262626); }
  .switch input:checked + .switch-track::after { transform: translateX(16px); }
  .switch input:focus-visible + .switch-track {
    outline: 2px solid var(--focus-ring, #4c8dff); outline-offset: 2px;
  }
  .switch input:disabled + .switch-track { cursor: default; opacity: .55; }
  .provider-select {
    min-width: 116px; height: 32px; padding: 0 28px 0 10px;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 6px;
    background: var(--surface-elevated, #ffffff); color: var(--text-primary, #1a1a1a);
    font: inherit;
  }
  .provider-select:disabled { cursor: default; opacity: .55; }
  .secret + .secret { margin-top: 16px; }
  /* title 与控制台链接右缩 2px 对齐胶囊输入框的文字视觉边(同 xd-mivo)。 */
  .label-row { display: flex; align-items: center; gap: 8px; padding-left: 2px; }
  .label-row .name { font-weight: 500; }
  /* 已保存徽标走反相 CTA 色对(亮色黑底白字/暗色白底黑字):状态徽标是这行
     唯一要被注意到的信息,灰底灰字一档在暗色下几乎隐形(2026-07-14 实反馈,同 xd-mivo)。 */
  .badge {
    /* 上 2 下 0:11px 字在这行高里视觉偏上,文字整体压下 1px 才居中。 */
    display: none; padding: 2px 8px 0; border-radius: 999px; font-size: 11px; font-weight: 500;
    background: var(--accent-cta-bg, #262626); color: var(--accent-pure-cta-fg, #ffffff);
  }
  .badge.on { display: inline-block; }
  /* 控制台链接:主字色(暗色主题下即白),观感对齐 xd-mivo 设置页「前往控制台获取 ↗」。
     href 与身份卡 network.secrets[].url 逐字一致,点击经主机外链闸转系统
     浏览器打开(声明之外的地址会被主机拦下,链接点了没反应)。 */
  .console-link {
    display: inline-block; margin-top: 8px; margin-left: 2px;
    font-size: 12px; font-weight: 500;
    color: var(--text-primary, #1a1a1a); text-decoration: none;
  }
  .console-link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .pill {
    display: flex; flex: 1 1 auto; align-items: center; height: 32px;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 999px;
    background: var(--surface-elevated, #ffffff); padding: 0 4px 0 12px;
  }
  .pill:focus-within { border-color: var(--focus-ring, #4c8dff); }
  .pill input {
    flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--text-primary, #1a1a1a); font: inherit;
  }
  .pill input::placeholder { color: var(--text-placeholder, #a8a8a4); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-tertiary, #8a8a86); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-chip, #efefec); }
  /* 空框时藏眼睛(已存值读不回,点了必没反应);占位不塌,免输入首字符时行内跳动。 */
  .icon-btn.hidden { visibility: hidden; pointer-events: none; }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn .off { display: none; }
  .icon-btn.revealed .on { display: none; }
  .icon-btn.revealed .off { display: block; }
  .btn {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  #status { margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86); min-height: 16px; }
  /* 空着不占位:没有消息时整行退场,别在卡片底部留一截空白(高度宿主实时跟量)。 */
  #status:empty { display: none; }
</style>
</head>
<body>
  <section class="preferences">
    <div class="preference-row">
      <div class="preference-copy">
        <div class="preference-title">默认使用 Cindy AI 搜索</div>
        <p class="hint">搜索可保持 Cindy AI；也可关闭并使用自己的 Brave / Tavily Key。Tavily Key 还会独立启用经用户确认的公开网页正文读取。</p>
      </div>
      <label class="switch">
        <input id="cindy-ai-enabled" type="checkbox" checked disabled aria-label="使用 Cindy AI 搜索">
        <span class="switch-track"></span>
      </label>
    </div>
    <div class="preference-row">
      <div class="preference-copy">
        <label class="preference-title" for="byo-default-provider">自备搜索渠道</label>
        <p class="hint">关闭 Cindy AI 搜索后使用。</p>
      </div>
      <select id="byo-default-provider" class="provider-select" disabled>
        <option value="brave">Brave</option>
        <option value="tavily">Tavily</option>
      </select>
    </div>
  </section>

  <div class="secret" data-key="brave_api_key" data-tail-prefix="BSA…" data-empty-ph="粘贴 BSA 开头的 key">
    <div class="label-row">
      <span class="name">Brave Search API Key</span>
      <span class="badge">✓ 已保存</span>
    </div>
    <div class="input-row">
      <div class="pill">
        <input class="key-input" type="password" autocomplete="off" spellcheck="false">
        <button class="icon-btn eye hidden" type="button" title="显示或隐藏">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>
      <button class="btn save" type="button">保存</button>
      <button class="btn clear" type="button">清除</button>
    </div>
    <a class="console-link" href="https://api-dashboard.search.brave.com/app/keys">前往控制台获取 ↗</a>
  </div>

  <div class="secret" data-key="tavily_api_key" data-tail-prefix="tvly-…" data-empty-ph="粘贴 tvly- 开头的 key">
    <div class="label-row">
      <span class="name">Tavily API Key</span>
      <span class="badge">✓ 已保存</span>
    </div>
    <p class="hint">用于 Tavily 搜索和经用户确认的公开网页正文读取；即使保持 Cindy AI 搜索也可单独使用正文读取。</p>
    <div class="input-row">
      <div class="pill">
        <input class="key-input" type="password" autocomplete="off" spellcheck="false">
        <button class="icon-btn eye hidden" type="button" title="显示或隐藏">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>
      <button class="btn save" type="button">保存</button>
      <button class="btn clear" type="button">清除</button>
    </div>
    <a class="console-link" href="https://app.tavily.com/home">前往控制台获取 ↗</a>
  </div>

  <p id="status"></p>

  <script src="/settings.js"></script>
</body>
</html>
