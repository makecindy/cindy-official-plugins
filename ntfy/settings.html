<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ntfy settings page (cindy-ghost:// sandbox). Servers and tokens go to the host
     through the /connections data plane: the host confirms, encrypts the token and
     never hands it back. The per-server default topic is a plain preference in /kv.
     Inline scripts are blocked by CSP, so the logic lives in settings.js, which also
     fills every data-i18n* attribute from its message table in the host language. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .label-row { display: flex; align-items: center; gap: 8px; padding-left: 2px; }
  .label-row .name { font-weight: 500; }
  .badge {
    padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: var(--surface-chip, #efefec); color: var(--text-tertiary, #6b6b67);
  }
  .hint { margin-top: 4px; padding-left: 2px; font-size: 12px; color: var(--text-tertiary, #6b6b67); }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .pill {
    display: flex; flex: 1 1 auto; align-items: center; height: 32px; min-width: 0;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 999px;
    background: var(--surface-elevated, #ffffff); padding: 0 4px 0 12px;
  }
  .pill:focus-within { border-color: var(--focus-ring, #4c8dff); }
  .pill input {
    flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--text-primary, #1a1a1a); font: inherit;
  }
  .pill input::placeholder { color: var(--text-placeholder, #8a8a86); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-tertiary, #6b6b67); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-chip, #efefec); }
  .icon-btn.hidden { visibility: hidden; pointer-events: none; }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn .off { display: none; }
  .icon-btn.revealed .on { display: none; }
  .icon-btn.revealed .off { display: block; }
  .btn {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .server {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px;
    padding: 6px 12px; border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 10px; background: var(--surface-elevated, #ffffff);
  }
  .server .who { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server .topic {
    flex: 0 1 160px; min-width: 96px; height: 26px; padding: 0 10px;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 999px;
    background: transparent; color: var(--text-primary, #1a1a1a); font: inherit; font-size: 12px;
  }
  .server .mini {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0); background: transparent;
    color: var(--text-secondary, #55554f); font-family: inherit;
  }
  .server .mini:hover { background: var(--surface-chip, #efefec); }
  .server .mini:disabled { opacity: 0.5; cursor: default; }
  .empty {
    margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 12px;
    border: 1px dashed var(--border-default, #e4e4e0);
    color: var(--text-tertiary, #6b6b67);
  }
  #status { margin-top: 8px; font-size: 12px; color: var(--text-secondary, #55554f); min-height: 16px; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <div class="label-row">
    <span class="name" id="title" data-i18n="title"></span>
    <span class="badge" id="badge" data-i18n="badge"></span>
  </div>
  <p class="hint" id="hint" data-i18n="hint"></p>
  <div id="list"></div>
  <div class="input-row">
    <div class="pill">
      <input id="host" type="text" data-i18n-aria-label="hostLabel" data-i18n-placeholder="hostPlaceholder" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="input-row">
    <div class="pill">
      <input id="token" type="password" data-i18n-aria-label="tokenLabel" data-i18n-placeholder="tokenPlaceholder" autocomplete="off" spellcheck="false">
      <button id="eye" class="icon-btn" type="button" data-i18n-aria-label="eye" data-i18n-title="eye">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      </button>
    </div>
  </div>
  <div class="input-row">
    <div class="pill">
      <input id="topic" type="text" data-i18n-aria-label="topicLabel" data-i18n-placeholder="topicPlaceholder" autocomplete="off" spellcheck="false">
    </div>
    <button id="add" class="btn" type="button" data-i18n="add"></button>
  </div>
  <p id="status" role="status"></p>
  <script src="/settings.js"></script>
</body>
</html>
